<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5a64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Packliste">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="app-icon-180.png">
<title>Packliste</title>
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#14232b;--mute:#5d7079;--line:#d6e0e3;--accent:#0e7c86;--accent-ink:#fff;--done:#2e9a5b;--head:#0e5a64;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d171b;--card:#162329;--ink:#e6eef0;--mute:#8da2ab;--line:#26363d;--accent:#34b3bf;--accent-ink:#06191c;--done:#4cc47f;--head:#0a3a42}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:#fff;padding:10px 14px 12px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
#total{font-variant-numeric:tabular-nums;font-size:15px;opacity:.9}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#7be0a4;transition:width .25s}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;font:inherit;font-size:16px}
.chip[aria-pressed=true]{background:#fff;color:var(--head);border-color:#fff;font-weight:600}
.tools{display:flex;gap:8px;padding:12px 14px 4px}
.tools input[type=search]{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;background:var(--card);color:var(--ink)}
.tools button{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.tools button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:8px 14px 40px;max-width:640px;margin:0 auto}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.cat{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:0;background:none;color:var(--ink);font:inherit;font-weight:700;text-align:left}
.cat .n{margin-left:auto;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.cat.ok .n{color:var(--done)}
.cat .arr{transition:transform .15s;color:var(--mute)}
section.closed .arr{transform:rotate(-90deg)}
section.closed .its{display:none}
.it{display:flex;align-items:center;gap:14px;min-height:48px;padding:6px 14px;border-top:1px solid var(--line);cursor:pointer}
.box{flex:none;width:28px;height:28px;border:2px solid var(--mute);border-radius:8px;display:grid;place-items:center;position:relative}
.box[data-s="1"]{background:var(--done);border-color:var(--done)}
.box[data-s="1"]::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.box[data-s="2"]{background:#e3a600;border-color:#e3a600}
.box[data-s="2"]::before,.box[data-s="2"]::after{content:"";position:absolute;width:16px;height:3px;background:#fff;border-radius:2px;top:50%;left:50%}
.box[data-s="2"]::before{transform:translate(-50%,-50%) rotate(45deg)}
.box[data-s="2"]::after{transform:translate(-50%,-50%) rotate(-45deg)}
.it[data-st="1"] .nm{color:var(--mute);text-decoration:line-through}
.it[data-st="2"] .nm{color:var(--mute);font-style:italic;text-decoration:line-through}
.legend{padding:2px 16px 0;font-size:13px;color:var(--mute)}
.it .t{display:inline-block;font-size:12px;padding:1px 7px;border-radius:9px;background:var(--line);color:var(--mute);margin-left:8px;vertical-align:1px}
.it .x{margin-left:auto;border:0;background:none;color:var(--mute);font-size:24px;width:44px;height:44px}
.sep{height:12px;background:var(--bg);border-top:1px solid var(--line)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet p{margin:0 0 10px;color:var(--mute);font-size:14px}
.rl{display:flex;align-items:center;gap:12px;min-height:44px;border-top:1px solid var(--line)}
.rl input{width:22px;height:22px;flex:none}
.row{display:flex;gap:10px;margin:14px 0 4px}
.row input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 10px;font:inherit;background:var(--bg);color:var(--ink)}
.btn{display:block;width:100%;min-height:48px;margin-top:8px;border-radius:12px;border:0;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.add{width:100%;min-height:48px;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);font:inherit;font-size:15px;text-align:left;padding:0 14px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.foot{text-align:center;margin-top:20px}
.foot button{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#c0392b;font:inherit}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Packliste</h1><span id="total"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="chips" id="chips"></div>
</header>
<div class="tools">
  <input type="search" id="q" placeholder="Suchen …" aria-label="Suchen" enterkeyhint="search">
  <button id="hide" aria-pressed="false">Erledigte ausblenden</button>
</div>
<p class="legend">1x tippen = ✓ eingepackt, 2x tippen = ✕ für diese Reise unnötig, 3x tippen = wieder offen</p>
<div class="tools"><button id="rem" style="flex:1">📅 Kalendereintrag fehlende Sachen</button></div>
<main id="list"></main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
"use strict";
const KEY = "packliste-v1";
// Schalter oben: "tanja" blendet die orangen Einträge ein/aus, die anderen schalten ganze Kategorien.
const SWITCHES = [["tanja","Tanja"],["kinder","Kinder"],["outdoor","Outdoor / Wandern"],["ferienwohnung","Ferienwohnung"],["camping","Camping"]];
const DEFAULTS = {tanja:true, kinder:true, outdoor:false, ferienwohnung:false, camping:false};

let S = {checked:{}, profile:{}, hideDone:false, closed:{}, custom:{}, query:""};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
S.profile = Object.assign({}, DEFAULTS, S.profile);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let DATA;

// Sichtbare Einträge einer Kategorie (nach Reiseprofil, ohne Suche/Ausblenden)
function itemsOf(cat) {
  const base = cat.items.filter(i => S.profile.tanja || !i.tanja);
  const own = (S.custom[cat.id] || []).map(i => ({...i, own:true}));
  return base.concat(own);
}

function render() {
  // Schalter
  $("chips").innerHTML = SWITCHES.map(([k, l]) =>
    `<button class="chip" data-sw="${k}" aria-pressed="${!!S.profile[k]}">${l}</button>`).join("");
  $("hide").setAttribute("aria-pressed", S.hideDone);

  const q = S.query.trim().toLowerCase();
  let total = 0, done = 0, html = "";
  for (const cat of DATA.categories) {
    if (cat.module && !S.profile[cat.module]) continue;
    const all = itemsOf(cat);
    const nDone = all.filter(i => S.checked[i.id]).length;
    total += all.length; done += nDone;
    let shown = all.filter(i => !q || i.name.toLowerCase().includes(q));
    if (S.hideDone) shown = shown.filter(i => !S.checked[i.id]);
    if (q && !shown.length) continue;
    const closed = S.closed[cat.id] && !q;
    html += `<section class="${closed ? "closed" : ""}"><button class="cat ${nDone === all.length && all.length ? "ok" : ""}" data-cat="${cat.id}">
      <span class="arr">▾</span><span>${esc(cat.name)}</span><span class="n">${nDone}/${all.length}</span></button><div class="its">`;
    let prevG = null;
    for (const i of shown) {
      const g = i.own ? "own" : i.g;                       // Bereiche aus den Leerzeilen der Excel
      if (prevG !== null && g !== prevG) html += '<div class="sep"></div>';
      prevG = g;
      const v = S.checked[i.id], st = v === true ? 1 : v === "skip" ? 2 : 0;   // 0 offen, 1 eingepackt, 2 unnötig
      html += `<div class="it" data-id="${i.id}" data-st="${st}" role="checkbox" aria-checked="${st === 1 ? "true" : st === 2 ? "mixed" : "false"}">
        <span class="box" data-s="${st}"></span>
        <span class="nm">${esc(i.name)}${i.tanja ? '<em class="t" style="font-style:normal">Tanja</em>' : ""}</span>
        ${i.own ? `<button class="x" data-del="${cat.id}|${i.id}" aria-label="Löschen">×</button>` : ""}</div>`;
    }
    html += `<button class="add" data-add="${cat.id}">+ Eigener Eintrag</button></div></section>`;
  }
  $("list").innerHTML = (html || '<p class="empty">Keine Treffer.</p>') +
    '<div class="foot"><button data-reset>Alle Häkchen zurücksetzen</button></div>';
  $("total").textContent = `${done} / ${total}`;
  $("fill").style.width = (total ? done / total * 100 : 0) + "%";
}

document.addEventListener("click", e => {
  const t = e.target;
  const sw = t.closest("[data-sw]"), cat = t.closest("[data-cat]"), add = t.closest("[data-add]"),
        del = t.closest("[data-del]"), it = t.closest("[data-id]"), reset = t.closest("[data-reset]");
  if (sw) { S.profile[sw.dataset.sw] = !S.profile[sw.dataset.sw]; }
  else if (cat) { S.closed[cat.dataset.cat] = !S.closed[cat.dataset.cat]; }
  else if (add) {
    const name = (prompt("Neuer Eintrag:") || "").trim();
    if (!name) return;
    const id = add.dataset.add;
    (S.custom[id] = S.custom[id] || []).push({id: "own-" + Date.now().toString(36), name, tanja:false});
    S.closed[id] = false;
  } else if (del) {
    e.preventDefault();
    const [c, id] = del.dataset.del.split("|");
    S.custom[c] = S.custom[c].filter(i => i.id !== id); delete S.checked[id];
  } else if (it) {
    // Tippen wechselt: offen -> eingepackt -> unnötig -> offen
    const id = it.dataset.id, v = S.checked[id];
    if (!v) S.checked[id] = true; else if (v === true) S.checked[id] = "skip"; else delete S.checked[id];
  } else if (reset) {
    if (!confirm("Wirklich alle Häkchen zurücksetzen?")) return;
    S.checked = {};
  } else if (t.id === "hide") { S.hideDone = !S.hideDone; }
  else return;
  save(); render();
});
$("q").addEventListener("input", e => { S.query = e.target.value; render(); });


// ---------- Erinnerung für die letzten Dinge ----------
const pad = n => String(n).padStart(2, "0");
let remItems = [];
function openItems() {              // alles, was noch offen ist (sichtbare Kategorien)
  const out = [];
  for (const cat of DATA.categories) {
    if (cat.module && !S.profile[cat.module]) continue;
    for (const i of itemsOf(cat)) if (!S.checked[i.id]) out.push(i.name);
  }
  return out;
}
function openRem() {
  remItems = openItems();
  const d = new Date(Date.now() + 864e5), tomorrow = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  $("sheet").innerHTML = `<h2>Kalendereintrag fehlende Sachen</h2>
    <p>Wähle, was noch fehlt und erst am Abreisetag eingepackt wird. Es werden nur offene Gegenstände angezeigt.</p>` +
    (remItems.length
      ? `<button class="btn sec" data-rall style="margin:0 0 6px;min-height:44px">Alle an/aus</button>` +
        remItems.map((n, k) => `<label class="rl"><input type="checkbox" data-r="${k}" checked><span>${esc(n)}</span></label>`).join("")
      : "<p>Alles erledigt – nichts mehr offen.</p>") +
    `<div class="row"><input type="date" id="rd" value="${tomorrow}"><input type="time" id="rt" value="${(S.rem && S.rem.time) || "07:00"}"></div>
     <button class="btn" data-ics>📅 Kalendereintrag erstellen</button>
     <button class="btn sec" data-txt>📝 Als Text teilen (z. B. Erinnerungen)</button>
     <button class="btn sec" data-close>Schliessen</button>`;
  $("ov").classList.add("on");
}
const picked = () => [...$("sheet").querySelectorAll("input[data-r]:checked")].map(x => remItems[x.dataset.r]);
const icsEsc = s => s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");

async function sendIcs(date, time, names) {
  const [y, m, d] = date.split("-"), [hh, mm] = time.split(":");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Packliste//DE", "BEGIN:VEVENT",
    "UID:" + Date.now() + "@packliste", "DTSTAMP:" + stamp, `DTSTART:${y}${m}${d}T${hh}${mm}00`, "DURATION:PT15M",
    "SUMMARY:" + icsEsc("Einpacken"),
    "DESCRIPTION:" + icsEsc(names.map(n => "• " + n).join("\n")),
    "BEGIN:VALARM", "TRIGGER:PT0M", "ACTION:DISPLAY", "DESCRIPTION:Einpacken", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const file = new File([body], "einpacken.ics", {type: "text/calendar"});
  try {                                         // iPhone: Teilen-Menü mit der Datei
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: "Einpacken"}); return; }
  } catch (err) { if (err.name === "AbortError") return; }
  const a = document.createElement("a");        // Fallback: Datei herunterladen
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function sendText(names) {
  const text = "Einpacken:\n" + names.map(n => "• " + n).join("\n");
  try {
    if (navigator.share) { await navigator.share({title: "Einpacken", text}); return; }
    await navigator.clipboard.writeText(text); alert("Liste kopiert.");
  } catch (err) { if (err.name !== "AbortError") alert("Teilen hat nicht geklappt."); }
}
$("rem").addEventListener("click", openRem);
$("ov").addEventListener("click", e => {
  const t = e.target, D = t.dataset || {};
  if (t.id === "ov" || "close" in D) { $("ov").classList.remove("on"); return; }
  if ("rall" in D) {
    const boxes = [...$("sheet").querySelectorAll("input[data-r]")], all = boxes.every(b => b.checked);
    boxes.forEach(b => b.checked = !all); return;
  }
  if (!("ics" in D) && !("txt" in D)) return;
  const names = picked();
  if (!names.length) { alert("Bitte mindestens einen Gegenstand wählen."); return; }
  const date = $("rd").value, time = $("rt").value || "07:00";
  S.rem = Object.assign(S.rem || {}, {time}); save();
  if ("txt" in D) { sendText(names); return; }
  if (!date) { alert("Bitte das Abreisedatum wählen."); return; }
  sendIcs(date, time, names);
});

async function start() {
  try { DATA = window.__DATA__ || await (await fetch("data.json")).json(); }
  catch (e) { $("list").innerHTML = '<p class="empty">data.json konnte nicht geladen werden.</p>'; return; }
  $("q").value = S.query = "";
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
start();
</script>
</body>
</html>
